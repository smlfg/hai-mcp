[project]
name = "hai-mcp"
version = "0.1.0"
description = "Model-agnostic HAI control-plane MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hai-mcp = "hai_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hai_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes the repo root importable so tests can reach scripts/ (test_stdio_smoke
# imports scripts.stdio_smoke); without it that import raises ModuleNotFoundError.
pythonpath = ["src", "."]
